<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#061626"
  >

  <title>PURSUIT — Syntax Arcade</title>

  <link
    rel="stylesheet"
    href="style.css?v=30"
  >
</head>

<body>

  <!-- =========================
       GAME CANVAS
  ========================== -->

  <canvas id="game"></canvas>


  <!-- =========================
       GAME HUD
  ========================== -->

  <div id="hud">

    <div class="hudBox distanceBox">
      <span class="hudLabel">
        DISTANCE
      </span>

      <span
        id="distanceValue"
        class="hudValue"
      >
        0 m
      </span>
    </div>


    <div class="hudBox speedBox">
      <span class="hudLabel">
        SPEED
      </span>

      <span
        id="speedValue"
        class="hudValue cyan"
      >
        0 km/h
      </span>
    </div>


    <div
      id="environmentBadge"
      class="environmentBadge"
    >
      CITY NIGHT
    </div>


    <div
      id="chaseStatus"
      class="chaseStatus"
    >
      STAY ON HIM!
    </div>


    <div
      id="stageTimer"
      class="stageTimer"
    >
    </div>

  </div>


  <!-- =========================
       NITRO
  ========================== -->

  <div
    id="nitroUI"
    class="nitroUI"
  >

    <div class="nitroHeader">

      <span>
        NITRO
      </span>

      <span id="nitroState">
        BUILDING
      </span>

    </div>

    <div class="nitroTrack">

      <div
        id="nitroFill"
        class="nitroFill"
      ></div>

    </div>

    <div class="controlHint">
      DRAG TO STEER • SWIPE UP ANYWHERE TO BOOST
    </div>

  </div>


  <!-- =========================
       MAIN MENU
  ========================== -->

  <div
    id="overlay"
    class="overlay"
  >

    <div class="menuCard">

      <button
        id="soundToggle"
        class="soundToggle"
        type="button"
        aria-label="Toggle sound"
      >
        🔊
      </button>


      <h1
        id="title"
        class="logo"
      >
        PURSUIT
      </h1>

      <div
        id="subtitle"
        class="subtitle"
      >
        CATCH THE CRIMINAL
      </div>


      <p class="menuPrompt">
        Choose your environment.
      </p>


      <!-- ENVIRONMENT GRID -->

      <div class="environmentGrid">

        <button
          class="envButton active"
          data-env="city"
          type="button"
        >
          <span class="envIcon">
            🌃
          </span>

          <span>
            CITY NIGHT
          </span>
        </button>


        <button
          class="envButton"
          data-env="highway"
          type="button"
        >
          <span class="envIcon">
            ☀️
          </span>

          <span>
            HIGHWAY
          </span>
        </button>


        <button
          class="envButton"
          data-env="rain"
          type="button"
        >
          <span class="envIcon">
            🌧️
          </span>

          <span>
            RAIN
          </span>
        </button>


        <button
          class="envButton"
          data-env="snow"
          type="button"
        >
          <span class="envIcon">
            ❄️
          </span>

          <span>
            SNOW
          </span>
        </button>


        <button
          class="envButton"
          data-env="desert"
          type="button"
        >
          <span class="envIcon">
            🌵
          </span>

          <span>
            DESERT
          </span>
        </button>


        <button
          class="envButton"
          data-env="tunnel"
          type="button"
        >
          <span class="envIcon">
            🚇
          </span>

          <span>
            TUNNEL
          </span>
        </button>

      </div>


      <!-- =========================
           CHASE MODE
      ========================== -->

      <div class="modeHeading">
        CHASE MODE
      </div>


      <div class="modeGrid">

        <button
          id="quickModeBtn"
          class="modeButton active"
          type="button"
        >
          <span class="modeTitle">
            QUICK
          </span>

          <span class="modeDescription">
            ONE LOCATION
          </span>
        </button>


        <button
          id="longModeBtn"
          class="modeButton"
          type="button"
        >
          <span class="modeTitle">
            LONG
          </span>

          <span class="modeDescription">
            ALL 6 LOCATIONS
          </span>
        </button>

      </div>


      <div
        id="message"
        class="modeInfo"
      >
        QUICK CHASE • ONE ENVIRONMENT
      </div>


      <button
        id="startBtn"
        class="startButton"
        type="button"
      >
        START CHASE
      </button>


      <div class="brand">
        SYNTAX ARCADE
      </div>

    </div>

  </div>


  <script src="game.js?v=30"></script>

</body>

</html>
