<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#061626">

  <title>PURSUIT — Syntax Arcade</title>

  <link rel="stylesheet" href="style.css?v=50">
</head>

<body>

  <canvas id="game"></canvas>


  <!-- =========================================
       HUD
  ========================================== -->

  <div id="hud">

    <div class="hudBox distanceBox">
      <span class="hudLabel">DISTANCE</span>
      <span id="distanceValue" class="hudValue">0 m</span>
    </div>


    <div class="hudBox speedBox">
      <span class="hudLabel">SPEED</span>
      <span id="speedValue" class="hudValue cyan">0 km/h</span>
    </div>


    <div class="livesBox">
      <span class="hudLabel">UNIT</span>

      <div id="heartsValue" class="heartsValue">
        ❤️ ❤️ ❤️ ❤️ ❤️
      </div>
    </div>


    <div class="scoreBox">

      <span class="hudLabel">SCORE</span>

      <span id="scoreValue" class="scoreValue">
        0
      </span>

      <div class="bestScoreRow">
        BEST
        <span id="bestScoreValue">0</span>
      </div>

    </div>


    <div
      id="environmentBadge"
      class="environmentBadge"
    >
      CITY NIGHT
    </div>


    <div
      id="stageTimer"
      class="stageTimer"
    ></div>


    <div
      id="chaseStatus"
      class="chaseStatus"
    ></div>

  </div>


  <!-- =========================================
       NITRO
  ========================================== -->

  <div id="nitroUI" class="nitroUI">

    <div class="nitroHeader">

      <span>
        NITRO
      </span>

      <span id="nitroState">
        BUILDING
      </span>

    </div>


    <div class="nitroTrack">

      <div
        id="nitroFill"
        class="nitroFill"
      ></div>

    </div>


    <div class="controlHint">
      DRAG TO STEER • SWIPE UP ANYWHERE TO BOOST
    </div>

  </div>


  <!-- =========================================
       MAIN MENU
  ========================================== -->

  <div id="overlay" class="overlay">

    <div class="menuCard">

      <button
        id="soundToggle"
        class="soundToggle"
        type="button"
      >
        🔊
      </button>


      <h1 id="title" class="logo">
        PURSUIT
      </h1>


      <div id="subtitle" class="subtitle">
        CATCH THE CRIMINAL
      </div>


      <p class="menuPrompt">
        Choose your environment.
      </p>


      <!-- ENVIRONMENTS -->

      <div class="environmentGrid">

        <button
          class="envButton active"
          data-env="city"
          type="button"
        >
          <span class="envIcon">🌃</span>
          <span>CITY NIGHT</span>
        </button>


        <button
          class="envButton"
          data-env="highway"
          type="button"
        >
          <span class="envIcon">☀️</span>
          <span>HIGHWAY</span>
        </button>


        <button
          class="envButton"
          data-env="rain"
          type="button"
        >
          <span class="envIcon">🌧️</span>
          <span>RAIN</span>
        </button>


        <button
          class="envButton"
          data-env="snow"
          type="button"
        >
          <span class="envIcon">❄️</span>
          <span>SNOW</span>
        </button>


        <button
          class="envButton"
          data-env="desert"
          type="button"
        >
          <span class="envIcon">🌵</span>
          <span>DESERT</span>
        </button>


        <button
          class="envButton"
          data-env="tunnel"
          type="button"
        >
          <span class="envIcon">🚇</span>
          <span>TUNNEL</span>
        </button>

      </div>


      <!-- CHASE MODE -->

      <div class="optionHeading">
        CHASE MODE
      </div>


      <div class="twoOptionGrid">

        <button
          id="quickModeBtn"
          class="choiceButton active"
          type="button"
        >
          <span class="choiceTitle">
            QUICK
          </span>

          <span class="choiceDescription">
            ONE LOCATION
          </span>
        </button>


        <button
          id="longModeBtn"
          class="choiceButton purpleChoice"
          type="button"
        >
          <span class="choiceTitle">
            LONG
          </span>

          <span class="choiceDescription">
            ALL 6 LOCATIONS
          </span>
        </button>

      </div>


      <!-- LEVEL LENGTH -->

      <div class="optionHeading">
        LEVEL LENGTH
      </div>


      <div class="twoOptionGrid">

        <button
          id="duration30Btn"
          class="choiceButton"
          type="button"
        >
          <span class="choiceTitle">
            30 SEC
          </span>

          <span class="choiceDescription">
            FAST
          </span>
        </button>


        <button
          id="duration60Btn"
          class="choiceButton active"
          type="button"
        >
          <span class="choiceTitle">
            1 MIN
          </span>

          <span class="choiceDescription">
            FULL CHASE
          </span>
        </button>

      </div>


      <!-- DIFFICULTY -->

      <div class="optionHeading">
        DIFFICULTY
      </div>


      <div class="difficultyGrid">

        <button
          id="easyBtn"
          class="difficultyButton active"
          type="button"
        >
          <span class="choiceTitle">
            EASY
          </span>

          <span class="choiceDescription">
            NORMAL TRAFFIC
          </span>

          <span class="multiplier">
            ×1 SCORE
          </span>
        </button>


        <button
          id="mediumBtn"
          class="difficultyButton"
          type="button"
        >
          <span class="choiceTitle">
            MEDIUM
          </span>

          <span class="choiceDescription">
            STALLED CARS
          </span>

          <span class="multiplier">
            ×1.5 SCORE
          </span>
        </button>


        <button
          id="hardBtn"
          class="difficultyButton hardChoice"
          type="button"
        >
          <span class="choiceTitle">
            HARD
          </span>

          <span class="choiceDescription">
            MORE HAZARDS
          </span>

          <span class="multiplier">
            ×2 SCORE
          </span>
        </button>

      </div>


      <div id="message" class="modeInfo">
        QUICK • 1 MIN • EASY • ×1 SCORE • 5 LIVES
      </div>


      <button
        id="startBtn"
        class="startButton"
        type="button"
      >
        START CHASE
      </button>


      <div class="brand">
        SYNTAX ARCADE
      </div>

    </div>

  </div>


  <script src="game.js?v=50"></script>

</body>

</html>
