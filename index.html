<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>PURSUIT — Syntax Arcade</title>

  <!-- Connects to style.css -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- GAME -->
  <canvas id="game"></canvas>


  <!-- HUD -->
  <div id="hud">

    <div class="topBar">

      <div class="hudBox">
        <div class="hudLabel">
          DISTANCE
        </div>

        <div
          class="hudValue"
          id="distanceValue"
        >
          240 m
        </div>
      </div>


      <div class="hudBox">
        <div class="hudLabel">
          SPEED
        </div>

        <div
          class="hudValue"
          id="speedValue"
        >
          0 km/h
        </div>
      </div>

    </div>


    <div id="chaseStatus">
      NEAR MISS!
    </div>


    <div id="nitroUI">

      <div id="nitroTitle">
        NITRO
      </div>

      <div id="nitroTrack">

        <div id="nitroFill"></div>

      </div>


      <div id="nitroHelp">
        DRAG TO STEER • TAP NITRO WHEN FULL
      </div>

    </div>

  </div>


  <!-- START / RESULTS SCREEN -->
  <div id="overlay">

    <div class="menu">

      <h1 id="title">
        PURSUIT
      </h1>


      <div id="subtitle">
        CATCH THE CRIMINAL
      </div>


      <div id="message">

        Your cruiser is faster than the suspect —
        if you can get through traffic cleanly.

        <br><br>

        Drag left and right to steer.
        Near misses charge nitro.

      </div>


      <button id="startBtn">
        START CHASE
      </button>


      <div id="brand">
        SYNTAX ARCADE
      </div>

    </div>

  </div>


  <!-- Connects to game.js -->
  <script src="game.js"></script>

</body>

</html>
