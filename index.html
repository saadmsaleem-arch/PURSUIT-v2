<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>PURSUIT — Syntax Arcade</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">

    <div class="topBar">

      <div class="hudBox">
        <div class="hudLabel">
          DISTANCE
        </div>

        <div
          class="hudValue"
          id="distanceValue"
        >
          245 m
        </div>
      </div>

      <div class="hudBox">
        <div class="hudLabel">
          SPEED
        </div>

        <div
          class="hudValue"
          id="speedValue"
        >
          0 km/h
        </div>
      </div>

    </div>

    <div id="environmentBadge">
      CITY NIGHT
    </div>

    <div id="chaseStatus">
      NEAR MISS!
    </div>

    <!-- Nitro is display-only now -->
    <div id="nitroUI">

      <div class="nitroTop">
        <span>NITRO</span>

        <span id="nitroState">
          BUILDING
        </span>
      </div>

      <div id="nitroTrack">
        <div id="nitroFill"></div>
      </div>

      <div id="nitroHelp">
        DRAG TO STEER • SWIPE UP TO BOOST
      </div>

    </div>

  </div>

  <!-- START / RESULTS OVERLAY -->
  <div id="overlay">

    <div class="menu">

      <div class="menuTop">

        <button
          id="soundToggle"
          type="button"
          aria-label="Toggle sound"
        >
          🔊
        </button>

      </div>

      <h1 id="title">
        PURSUIT
      </h1>

      <div id="subtitle">
        CATCH THE CRIMINAL
      </div>

      <div id="message">
        Choose your environment.
      </div>

      <div id="environmentSelector">

        <button
          class="envButton active"
          data-env="city"
          type="button"
        >
          <span class="envEmoji">🌃</span>
          <span class="envName">CITY NIGHT</span>
        </button>

        <button
          class="envButton"
          data-env="highway"
          type="button"
        >
          <span class="envEmoji">☀️</span>
          <span class="envName">HIGHWAY</span>
        </button>

        <button
          class="envButton"
          data-env="rain"
          type="button"
        >
          <span class="envEmoji">🌧️</span>
          <span class="envName">RAIN</span>
        </button>

        <button
          class="envButton"
          data-env="snow"
          type="button"
        >
          <span class="envEmoji">❄️</span>
          <span class="envName">SNOW</span>
        </button>

        <button
          class="envButton"
          data-env="desert"
          type="button"
        >
          <span class="envEmoji">🏜️</span>
          <span class="envName">DESERT</span>
        </button>

        <button
          class="envButton"
          data-env="tunnel"
          type="button"
        >
          <span class="envEmoji">🚇</span>
          <span class="envName">TUNNEL</span>
        </button>

      </div>

      <button
        id="startBtn"
        type="button"
      >
        START CHASE
      </button>

      <div id="brand">
        SYNTAX ARCADE
      </div>

    </div>

  </div>

  <script src="game.js"></script>

</body>

</html>
